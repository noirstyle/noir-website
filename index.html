<!DOCTYPE html>
<html lang="tr">

<head>

    <title>NOIR</title>
    <link rel="stylesheet" href="style.css">

<body>

    ========================== -->

    ========================== -->

    <div class="account-menu">

    ========================== -->

        <a href="#" class="collection-link">

                </div>

            </div>

        </a>


        <!-- LIMITED -->

        <a href="#" class="collection-link">

            <div class="collection-card">

    ========================== -->

    <script src="script.js"></script>
